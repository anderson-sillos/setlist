      <stop offset="0" stop-color="#09090c" stop-opacity="0.84" />
      <stop offset="0.36" stop-color="#09090c" stop-opacity="0.76" />
      <stop offset="0.56" stop-color="#09090c" stop-opacity="0.38" />
      <stop offset="0.72" stop-color="#09090c" stop-opacity="0" />
