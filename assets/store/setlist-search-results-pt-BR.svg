<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3840" height="2560" viewBox="0 0 3840 2560">
  <defs>
    <linearGradient id="copyScrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#09090c" stop-opacity="0.58" />
      <stop offset="0.42" stop-color="#09090c" stop-opacity="0.48" />
      <stop offset="0.61" stop-color="#09090c" stop-opacity="0.16" />
      <stop offset="0.78" stop-color="#09090c" stop-opacity="0" />
    </linearGradient>
    <clipPath id="appIconClip">
      <rect x="260" y="300" width="168" height="168" rx="42" />
    </clipPath>
    <clipPath id="screenClip">
      <rect x="2240" y="365" width="1360" height="1813" rx="32" />
    </clipPath>
    <filter id="screenShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="32" stdDeviation="46" flood-color="#000000" flood-opacity="0.62" />
    </filter>
  </defs>

  <image x="0" y="0" width="3840" height="2560" preserveAspectRatio="xMidYMid slice" xlink:href="setlist-search-results-background.png" />
  <rect x="0" y="0" width="3840" height="2560" fill="#09090c" fill-opacity="0.12" />
  <rect x="0" y="0" width="3840" height="2560" fill="url(#copyScrim)" />

  <image x="260" y="300" width="168" height="168" preserveAspectRatio="xMidYMid slice" clip-path="url(#appIconClip)" xlink:href="../icons/app-icon-1024.png" />
  <text x="472" y="423" fill="#ffffff" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="112" font-weight="700" letter-spacing="-2">Setlist</text>

  <text x="260" y="930" fill="#ffffff" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="168" font-weight="700" letter-spacing="-3">Organize seu</text>
  <text x="260" y="1130" fill="#ffffff" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="168" font-weight="700" letter-spacing="-3">repertório.</text>
  <text x="260" y="1330" fill="#ffffff" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="168" font-weight="700" letter-spacing="-3">Prepare seus shows.</text>

  <rect x="260" y="1445" width="8" height="122" rx="4" fill="#a78bfa" />
  <text x="304" y="1500" fill="#e5e3eb" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="400">Músicas, setlists e letras em um só lugar.</text>

  <rect x="2215" y="340" width="1410" height="1863" rx="54" fill="#0c0b10" stroke="#514467" stroke-width="4" filter="url(#screenShadow)" />
  <image x="2240" y="365" width="1360" height="1813" preserveAspectRatio="xMidYMid slice" clip-path="url(#screenClip)" xlink:href="../../captura/iOS-iPad-13-repertorio.png" />
</svg>
