name: Backup diário do Supabase

on:
  schedule:
    - cron: '17 6 * * *'
    # Catch-up run: the script skips this date if the verified daily copy exists.
    - cron: '37 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-backup

    steps:
      - name: Sinalizar início ao monitor externo
        env:
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
        run: |
          if [ -z "$BACKUP_HEARTBEAT_URL" ]; then
            echo "::warning::BACKUP_HEARTBEAT_URL ausente; monitor externo ainda não está configurado"
            exit 0
          fi
          case "$BACKUP_HEARTBEAT_URL" in
            https://hc-ping.com/*) ;;
            *)
              echo "::warning::BACKUP_HEARTBEAT_URL não usa o endpoint esperado do Healthchecks.io"
              exit 0
              ;;
          esac
          if ! curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 10 --max-time 20 --output /dev/null \
            "${BACKUP_HEARTBEAT_URL%/}/start" 2>/dev/null; then
            echo "::warning::não foi possível enviar o sinal de início ao monitor externo"
          fi

      - name: Obter o script da branch principal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Instalar ferramentas de banco e criptografia
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes postgresql-client rclone
          docker info --format 'Docker Engine {{.ServerVersion}}'
          rclone version

      - name: Preparar a configuração temporária do Drive
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            printf '%s\n' "RCLONE_CONFIG_B64 não configurado no Environment production-backup" >&2
            exit 1
          fi
          config_dir="$(mktemp -d "$RUNNER_TEMP/rclone-config.XXXXXX")"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$config_dir/rclone.conf"
          chmod 600 "$config_dir/rclone.conf"
          printf 'RCLONE_CONFIG=%s\n' "$config_dir/rclone.conf" >> "$GITHUB_ENV"
          printf 'RCLONE_CONFIG_DIR=%s\n' "$config_dir" >> "$GITHUB_ENV"
          unset RCLONE_CONFIG_B64

      - name: Transmitir backup cifrado diretamente ao Drive
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_CLI_VERSION: 2.121.0
          BACKUP_RCLONE_REMOTE: setlist-backup
          BACKUP_PATH: setlist-prod/daily
          BACKUP_RETENTION_COUNT: 84
          BACKUP_SKIP_IF_EXISTS: ${{ github.event_name == 'schedule' }}
        run: bash scripts/backup-supabase-to-drive.sh

      - name: Apagar a configuração temporária do Drive
        if: always()
        run: |
          if [ -n "${RCLONE_CONFIG:-}" ]; then
            rm -f "$RCLONE_CONFIG"
          fi
          if [ -n "${RCLONE_CONFIG_DIR:-}" ]; then
            rmdir "$RCLONE_CONFIG_DIR" 2>/dev/null || true
          fi

      - name: Sinalizar resultado ao monitor externo
        if: always()
        env:
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
          BACKUP_JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$BACKUP_HEARTBEAT_URL" ]; then
            echo "::warning::BACKUP_HEARTBEAT_URL ausente; resultado não enviado ao monitor externo"
            exit 0
          fi
          case "$BACKUP_HEARTBEAT_URL" in
            https://hc-ping.com/*) ;;
            *)
              echo "::warning::BACKUP_HEARTBEAT_URL não usa o endpoint esperado do Healthchecks.io"
              exit 0
              ;;
          esac
          signal=""
          if [ "$BACKUP_JOB_STATUS" != "success" ]; then
            signal="/fail"
          fi
          if ! curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --connect-timeout 10 --max-time 20 --output /dev/null \
            "${BACKUP_HEARTBEAT_URL%/}${signal}" 2>/dev/null; then
            echo "::warning::não foi possível enviar o resultado ao monitor externo"
          fi
