name: Publicar agendador Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/cron-scheduler/**'
      - '.github/workflows/deploy-cloudflare-scheduler.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-scheduler
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: cloudflare-scheduler

    steps:
      - name: Obter o código da branch principal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Instalar o Wrangler fixado pelo lockfile
        run: npm ci --prefix cloudflare/cron-scheduler

      - name: Implantar o Worker desativado
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix cloudflare/cron-scheduler wrangler deploy --config cloudflare/cron-scheduler/wrangler.jsonc --var SCHEDULER_ENABLED:false

      - name: Gravar a chave do GitHub App como secret do Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_INSTALLATION_ID: ${{ secrets.GITHUB_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in GITHUB_APP_ID GITHUB_INSTALLATION_ID GITHUB_APP_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Secret obrigatório ausente no Environment cloudflare-scheduler: ${name}" >&2
              exit 1
            fi
            printf '%s' "${!name}" | npx --prefix cloudflare/cron-scheduler wrangler secret put "$name" --config cloudflare/cron-scheduler/wrangler.jsonc >/dev/null
          done

      - name: Ativar os schedules no Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix cloudflare/cron-scheduler wrangler deploy --config cloudflare/cron-scheduler/wrangler.jsonc --var SCHEDULER_ENABLED:true
