name: Publicar GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag de Release publicada (vX.Y.Z estável ou vX.Y.Z-rc.N para publicar manualmente a Web candidata)
        required: true
        type: string
      publish_current_legal_docs:
        description: Usar os termos e a política de privacidade atuais da branch main
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar site estático
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      PUBLISH_CURRENT_LEGAL_DOCS: ${{ inputs.publish_current_legal_docs || false }}
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_LRCLIB_APP_ID: ${{ vars.EXPO_PUBLIC_LRCLIB_APP_ID }}
      EXPO_PUBLIC_WEB_BASE_URL: https://setlistbr.app.br
      EXPO_WEB_BASE_URL: .

    steps:
      - name: Exigir workflow manual executado na main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Execute o workflow manual selecionando a branch main." >&2
            exit 1
          fi

      - name: Obter workflow e validador confiáveis da main
        uses: actions/checkout@v7
        with:
          ref: main
          path: workflow-source
          fetch-depth: 0

      - name: Obter código imutável da Release
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.event.release.tag_name }}
          path: release-source
          fetch-depth: 0

      - name: Configurar Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version-file: workflow-source/.nvmrc
          cache: npm
          cache-dependency-path: release-source/package-lock.json

      - name: Configurar npm
        run: |
          if [ "$(npm --version)" != "11.20.0" ]; then
            npm install --global npm@11.20.0 --prefer-offline --no-fund
          fi

      - name: Instalar dependências
        working-directory: release-source
        run: /usr/bin/time -v npm ci --prefer-offline --no-fund

      - name: Obter documentos legais atuais da branch principal
        if: env.PUBLISH_CURRENT_LEGAL_DOCS == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          path: legal-source
          sparse-checkout: |
            docs/legal.css
            docs/termos.html
            docs/privacidade.html
          sparse-checkout-cone-mode: false

      - name: Conferir tag e registro da Release publicada
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-source
        run: |
          npm run release:check -- --tag "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,body,assets > "$RUNNER_TEMP/release.json"
          node --input-type=module - "$RUNNER_TEMP/release.json" <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const release = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const tag = process.env.RELEASE_TAG;
          const stable = /^v\d+\.\d+\.\d+$/.test(tag);
          const candidate = /^v\d+\.\d+\.\d+-rc\.[1-9]\d*$/.test(tag);
          if (release.isDraft || release.tagName !== tag || (!stable && !candidate) || release.isPrerelease !== candidate) {
            throw new Error('Use uma Release estável publicada ou uma pré-release publicada para o deploy manual da Web candidata.');
          }
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          appendFileSync(process.env.GITHUB_ENV, `SETLIST_RELEASE_COMMIT=${commit}\nSETLIST_RELEASE_TAG=${release.tagName}\nSETLIST_RELEASE_CANDIDATE=${candidate}\n`);
          NODE

      - name: Baixar e validar manifesto seguro da Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-source
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir "$RUNNER_TEMP/release-record"
          node "$GITHUB_WORKSPACE/workflow-source/scripts/release-manifest.mjs" \
            --root "$GITHUB_WORKSPACE/release-source" \
            --tag "$RELEASE_TAG" \
            --manifest "$RUNNER_TEMP/release-record/release-manifest.json" \
            --release-metadata "$RUNNER_TEMP/release.json"

      - name: Exigir validação completa para publicação estável
        if: env.SETLIST_RELEASE_CANDIDATE != 'true'
        working-directory: release-source
        run: npm run release:manifest -- --tag "$RELEASE_TAG" --manifest "$RUNNER_TEMP/release-record/release-manifest.json" --ready

      - name: Verificar configuração pública do Supabase
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test "$EXPO_PUBLIC_SUPABASE_URL" = "https://tqijocmmiwistinrjpwl.supabase.co" || (echo "EXPO_PUBLIC_SUPABASE_URL deve apontar para setlist-prod" && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || (echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY não configurada nas variáveis do repositório" && exit 1)
          case "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *) echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY deve ser uma chave publicável sb_publishable_; nunca use sb_secret ou service_role" >&2; exit 1 ;;
          esac

      - name: Preparar associações de links nativos
        working-directory: release-source
        env:
          SETLIST_ANDROID_SHA256_CERT_FINGERPRINTS: ${{ vars.SETLIST_ANDROID_SHA256_CERT_FINGERPRINTS }}
          SETLIST_IOS_TEAM_ID: ${{ vars.SETLIST_IOS_TEAM_ID }}
        run: npm run links:prepare

      - name: Identificar cache Metro
        id: metro
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const environment = Object.entries(process.env).filter(([key]) => key.startsWith('EXPO_PUBLIC_') || ['EXPO_WEB_BASE_URL', 'NODE_ENV', 'BABEL_ENV'].includes(key)).sort(([a], [b]) => a.localeCompare(b));
          const fingerprint = createHash('sha256').update(JSON.stringify(environment)).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT, `path=${join(tmpdir(), 'metro-cache')}\nenvironment=${fingerprint}\n`);
          NODE

      - name: Restaurar transformações Metro de produção
        uses: actions/cache@v6
        with:
          path: ${{ steps.metro.outputs.path }}
          key: metro-production-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ steps.metro.outputs.environment }}-${{ hashFiles('release-source/package-lock.json', 'release-source/app.json', 'release-source/app.config.*', 'release-source/metro.config.*', 'release-source/babel.config.*', 'release-source/tsconfig.json') }}-${{ env.SETLIST_RELEASE_COMMIT }}
          restore-keys: |
            metro-production-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ steps.metro.outputs.environment }}-${{ hashFiles('release-source/package-lock.json', 'release-source/app.json', 'release-source/app.config.*', 'release-source/metro.config.*', 'release-source/babel.config.*', 'release-source/tsconfig.json') }}-

      - name: Exportar aplicação web
        working-directory: release-source
        run: /usr/bin/time -v npm run export:web -- --output-dir dist

      - name: Incluir apresentação, documentos legais e fallback de rotas
        run: |
          mkdir -p pages-site/app pages-site/docs pages-site/termos pages-site/privacidade
          cp -R release-source/dist/. pages-site/
          cp -R release-source/dist/. pages-site/app/
          if [ -d release-source/public/.well-known ]; then
            mkdir -p pages-site/.well-known pages-site/app/.well-known
            cp -R release-source/public/.well-known/. pages-site/.well-known/
            cp -R release-source/public/.well-known/. pages-site/app/.well-known/
          fi
          cp release-source/docs/apresentacao.html pages-site/docs/apresentacao.html
          if [ "$PUBLISH_CURRENT_LEGAL_DOCS" = "true" ]; then
            cp legal-source/docs/legal.css pages-site/legal.css
            cp legal-source/docs/termos.html pages-site/termos/index.html
            cp legal-source/docs/privacidade.html pages-site/privacidade/index.html
          else
            cp release-source/docs/legal.css pages-site/legal.css
            cp release-source/docs/termos.html pages-site/termos/index.html
            cp release-source/docs/privacidade.html pages-site/privacidade/index.html
          fi
          cp "$RUNNER_TEMP/release-record/release-manifest.json" pages-site/release.json
          cp "$RUNNER_TEMP/release-record/release-manifest.json" pages-site/app/release.json
          cp pages-site/index.html pages-site/404.html
          find pages-site -type f -name '*.html' ! -path 'pages-site/docs/*' ! -path 'pages-site/termos/*' ! -path 'pages-site/privacidade/*' -print0 | xargs -0 -r node workflow-source/scripts/prepare-pages-html.mjs
          touch pages-site/.nojekyll

      - name: Verificar manifestos publicados Web e /app
        run: |
          node "$GITHUB_WORKSPACE/workflow-source/scripts/release-manifest.mjs" \
            --root "$GITHUB_WORKSPACE/release-source" \
            --tag "$RELEASE_TAG" \
            --manifest "$RUNNER_TEMP/release-record/release-manifest.json" \
            --release-metadata "$RUNNER_TEMP/release.json" \
            --verify-release-copy "$GITHUB_WORKSPACE/pages-site/release.json" \
            --verify-app-copy "$GITHUB_WORKSPACE/pages-site/app/release.json"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar artefato estático
        run: |
          tar \
            --dereference --hard-dereference \
            --directory pages-site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Enviar artefato estático
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Publicar site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
