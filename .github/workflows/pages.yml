name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
      - feat/reviewable-app
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar site estático
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar configuração pública do Supabase
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || (echo "EXPO_PUBLIC_SUPABASE_URL não configurada nas variáveis do repositório" && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || (echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY não configurada nas variáveis do repositório" && exit 1)

      - name: Preparar associações de links nativos
        env:
          SETLIST_ANDROID_SHA256_CERT_FINGERPRINTS: ${{ vars.SETLIST_ANDROID_SHA256_CERT_FINGERPRINTS }}
          SETLIST_IOS_TEAM_ID: ${{ vars.SETLIST_IOS_TEAM_ID }}
        run: npm run links:prepare

      - name: Exportar aplicação web
        env:
          EXPO_PUBLIC_APP_ENV: ${{ vars.EXPO_PUBLIC_APP_ENV || 'development' }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_WEB_BASE_URL: https://setlistbr.app.br
          EXPO_WEB_BASE_URL: .
        run: npm run export:web -- --output-dir dist

      - name: Incluir apresentação e fallback de rotas
        run: |
          mkdir -p pages-site/app pages-site/docs
          cp -R dist/. pages-site/
          cp -R dist/. pages-site/app/
          if [ -d public/.well-known ]; then
            mkdir -p pages-site/.well-known pages-site/app/.well-known
            cp -R public/.well-known/. pages-site/.well-known/
            cp -R public/.well-known/. pages-site/app/.well-known/
          fi
          cp docs/apresentacao.html pages-site/docs/apresentacao.html
          cp pages-site/index.html pages-site/404.html
          find pages-site -type f -name '*.html' ! -path 'pages-site/docs/*' -print0 | xargs -0 -r node scripts/prepare-pages-html.mjs
          touch pages-site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar artefato estático
        run: |
          tar \
            --dereference --hard-dereference \
            --directory pages-site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Enviar artefato estático
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Publicar site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
