name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
      - feat/reviewable-app
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar site estático
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Exportar aplicação web
        env:
          EXPO_WEB_BASE_URL: /setlist/app
        run: npm run export:web -- --output-dir dist/app

      - name: Incluir apresentação e fallback de rotas
        run: |
          mkdir -p pages-site/app pages-site/docs
          cp -R dist/app/. pages-site/app/
          cp index.html pages-site/index.html
          cp docs/apresentacao.html pages-site/docs/apresentacao.html
          cp pages-site/app/index.html pages-site/404.html
          touch pages-site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy:
    name: Publicar site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
