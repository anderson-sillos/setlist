name: Publicar GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag de Release publicada (vX.Y.Z estável ou vX.Y.Z-rc.N para publicar manualmente a Web candidata)
        required: true
        type: string
      publish_current_legal_docs:
        description: Usar os termos e a política de privacidade atuais da branch main
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar site estático
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      PUBLISH_CURRENT_LEGAL_DOCS: ${{ inputs.publish_current_legal_docs || false }}

    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Obter documentos legais atuais da branch principal
        if: env.PUBLISH_CURRENT_LEGAL_DOCS == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          path: legal-source
          sparse-checkout: |
            docs/legal.css
            docs/termos.html
            docs/privacidade.html
          sparse-checkout-cone-mode: false

      - name: Conferir tag e registro da Release publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run release:check -- --tag "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/release.json"
          node --input-type=module - "$RUNNER_TEMP/release.json" <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const release = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const tag = process.env.RELEASE_TAG;
          const stable = /^v\d+\.\d+\.\d+$/.test(tag);
          const candidate = /^v\d+\.\d+\.\d+-rc\.[1-9]\d*$/.test(tag);
          if (release.isDraft || release.tagName !== tag || (!stable && !candidate) || release.isPrerelease !== candidate) {
            throw new Error('Use uma Release estável publicada ou uma pré-release publicada para o deploy manual da Web candidata.');
          }
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          appendFileSync(process.env.GITHUB_ENV, `SETLIST_RELEASE_COMMIT=${commit}\nSETLIST_RELEASE_TAG=${release.tagName}\nSETLIST_RELEASE_CANDIDATE=${candidate}\n`);
          NODE

      - name: Baixar e conferir manifesto da Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir "$RUNNER_TEMP/release-record"
          node --input-type=module - "$RUNNER_TEMP/release-record/release-manifest.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const version = process.env.RELEASE_TAG.match(/^v(\d+\.\d+\.\d+)/)?.[1];
          const commit = process.env.SETLIST_RELEASE_COMMIT;
          const candidate = process.env.SETLIST_RELEASE_CANDIDATE === 'true';
          if (manifest.schemaVersion !== 1 || manifest.version !== version || manifest.commit !== commit || (candidate && (manifest.tag !== process.env.RELEASE_TAG || manifest.candidate !== true))) {
            throw new Error('O manifesto não corresponde à versão, ao commit e à tag publicados.');
          }
          for (const [platform, profile] of [['android', 'production-android'], ['ios', 'production']]) {
            const build = manifest.platforms?.[platform];
            const extension = platform === 'android' ? '.aab' : '.ipa';
            if (!build || build.version !== version || build.commit !== commit || !build.id || !build.build || build.profile !== profile || build.distribution !== 'STORE' || !build.artifactUrl?.startsWith('https://expo.dev/') || !build.artifactUrl.endsWith(extension)) {
              throw new Error(`O build ${platform} não corresponde à candidata publicada.`);
            }
          }
          const web = manifest.platforms?.web;
          if (!web || web.version !== version || web.commit !== commit || web.url !== 'https://setlistbr.app.br') {
            throw new Error('O registro Web não corresponde à versão, ao commit ou ao domínio público.');
          }
          NODE
          npm run release:manifest -- --tag "$RELEASE_TAG" --manifest "$RUNNER_TEMP/release-record/release-manifest.json"

      - name: Exigir validação completa para publicação estável
        if: env.SETLIST_RELEASE_CANDIDATE != 'true'
        run: npm run release:manifest -- --tag "$RELEASE_TAG" --manifest "$RUNNER_TEMP/release-record/release-manifest.json" --ready

      - name: Verificar configuração pública do Supabase
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test "$EXPO_PUBLIC_SUPABASE_URL" = "https://tqijocmmiwistinrjpwl.supabase.co" || (echo "EXPO_PUBLIC_SUPABASE_URL deve apontar para setlist-prod" && exit 1)
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || (echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY não configurada nas variáveis do repositório" && exit 1)

      - name: Preparar associações de links nativos
        env:
          SETLIST_ANDROID_SHA256_CERT_FINGERPRINTS: ${{ vars.SETLIST_ANDROID_SHA256_CERT_FINGERPRINTS }}
          SETLIST_IOS_TEAM_ID: ${{ vars.SETLIST_IOS_TEAM_ID }}
        run: npm run links:prepare

      - name: Exportar aplicação web
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_WEB_BASE_URL: https://setlistbr.app.br
          EXPO_WEB_BASE_URL: .
        run: npm run export:web -- --output-dir dist

      - name: Incluir apresentação, documentos legais e fallback de rotas
        run: |
          mkdir -p pages-site/app pages-site/docs pages-site/termos pages-site/privacidade
          cp -R dist/. pages-site/
          cp -R dist/. pages-site/app/
          if [ -d public/.well-known ]; then
            mkdir -p pages-site/.well-known pages-site/app/.well-known
            cp -R public/.well-known/. pages-site/.well-known/
            cp -R public/.well-known/. pages-site/app/.well-known/
          fi
          cp docs/apresentacao.html pages-site/docs/apresentacao.html
          if [ "$PUBLISH_CURRENT_LEGAL_DOCS" = "true" ]; then
            cp legal-source/docs/legal.css pages-site/legal.css
            cp legal-source/docs/termos.html pages-site/termos/index.html
            cp legal-source/docs/privacidade.html pages-site/privacidade/index.html
          else
            cp docs/legal.css pages-site/legal.css
            cp docs/termos.html pages-site/termos/index.html
            cp docs/privacidade.html pages-site/privacidade/index.html
          fi
          cp "$RUNNER_TEMP/release-record/release-manifest.json" pages-site/release.json
          cp "$RUNNER_TEMP/release-record/release-manifest.json" pages-site/app/release.json
          cp pages-site/index.html pages-site/404.html
          find pages-site -type f -name '*.html' ! -path 'pages-site/docs/*' ! -path 'pages-site/termos/*' ! -path 'pages-site/privacidade/*' -print0 | xargs -0 -r node scripts/prepare-pages-html.mjs
          touch pages-site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar artefato estático
        run: |
          tar \
            --dereference --hard-dereference \
            --directory pages-site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Enviar artefato estático
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Publicar site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
