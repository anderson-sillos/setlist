name: Testes do banco

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: Migrações e testes pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_CLI_VERSION: 2.117.0

    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classificar alterações
        id: scope
        run: node scripts/ci-scope.mjs

      - name: Configurar Supabase CLI
        if: steps.scope.outputs.run_checks == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Conferir cliente PostgreSQL
        if: steps.scope.outputs.run_checks == 'true'
        run: |
          if command -v psql >/dev/null 2>&1; then
            psql --version
          else
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y postgresql-client
          fi

      - name: Iniciar banco local com migrações e seed
        if: steps.scope.outputs.run_checks == 'true'
        id: start_db
        run: /usr/bin/time -v supabase db start

      - name: Verificar inclusões concorrentes em coleções
        if: steps.scope.outputs.run_checks == 'true'
        run: bash scripts/test-repertoire-collection-concurrency.sh

      - name: Verificar schema e tipos
        if: steps.scope.outputs.run_checks == 'true'
        run: supabase db lint --local --schema public --fail-on error

      - name: Executar testes pgTAP
        if: steps.scope.outputs.run_checks == 'true'
        run: supabase test db

      - name: Parar banco local
        if: always() && steps.start_db.outcome != '' && steps.start_db.outcome != 'skipped'
        run: supabase stop --no-backup

      - name: Registrar dispensa dos testes de banco
        if: steps.scope.outputs.run_checks == 'false'
        run: echo 'PR somente documental. Preparação do Supabase, migrações e testes de banco dispensados.' >> "$GITHUB_STEP_SUMMARY"
